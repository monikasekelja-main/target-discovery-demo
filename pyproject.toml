[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "target-discovery-demo"
version = "0.2.0"
description = "Synthetic target-discovery workbench with auditable local decisions"
requires-python = ">=3.12"
dependencies = ["pydantic==2.13.5"]

[project.optional-dependencies]
ui = ["streamlit==1.66.0", "plotly==7.1.0", "matplotlib==3.10.8"]

[project.scripts]
target-discovery = "target_discovery.cli.demo:main"
target-discovery-agents = "target_discovery.cli.agent_demo:main"

[tool.setuptools.packages.find]
include = ["target_discovery*"]
